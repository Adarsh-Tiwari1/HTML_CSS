<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>
    <script src='main.js'></script>
    <link rel="stylesheet" href="registration.css">
</head>
<body>
    <form id="form">
        <div>
            <div>Full Name</div>
            <div><input type="text" maxlength="30" placeholder="Enter your name"></div>
            <div>Emali</div>
            <div><input type="email" maxlength="40" placeholder="Enter your email"></div>
            <div>Password</div>
            <div><input type="password" placeholder="Enter your password"></div>
        </div>
        <div>
            <div>Username</div>
            <div><input type="text" maxlength="30" placeholder="Enter your last name"></div>
            <div>Phone Number</div>
            <div><input type="number" maxlength="10" placeholder="Enter your number"></div>
            <div>Confirm password</div>
            <div><input type="password" placeholder="Confirm your password"></div>
        </div>
        <div id="gender">
            <div>Gender</div>
            <div><input type="radio">Male</div>
            <div><input type="radio">Female</div>
            <div><input type="radio">Other</div>
        </div>
    </form>
    
   
</body>
</html>
