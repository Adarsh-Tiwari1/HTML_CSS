<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>
    <script src='main.js'></script>
    <style>
        /* Outer box styling */
.outer-box {
    width: 300px;
    height: 150px;
    background-color: pink;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 15px;
    margin: 50px auto;
}

/* Inner box styling */
.inner-box {
    width: 200px;
    height: 100px;
    background-color: limegreen;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 10px;
    border: 2px solid black;
}

/* Text styling */
.box-text {
    font-size: 24px;
    font-weight: bold;
    color: white;
}

    </style>
</head>
<body>
    <div class="outer-box">
        <div class="inner-box">
            <span class="box-text">CYBORG</span>
        </div>
    </div>
</body>
</html>
